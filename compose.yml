services:
  floci:
    image: hectorvent/floci:1.1.0
    ports:
      - '4566:4566' # Floci Gateway
      - '4510-4559:4510-4559' # external services port range
    env_file:
      - 'compose/aws.env'
    environment:
      DEBUG: ${DEBUG:-1}
      LS_LOG: WARN # Floci DEBUG Level
      SERVICES: s3,sqs,sns,firehose
      MONITOR_SQS: ${MONITOR_SQS:-true}
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://127.0.0.1:4566']
      interval: 5s
      start_period: 5s
      retries: 3
    networks:
      - cdp-tenant

  floci-init:
    image: amazon/aws-cli
    entrypoint: /bin/sh
    command: /setup/start-floci.sh
    depends_on:
      floci:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    volumes:
      - ./compose/start-floci.sh:/setup/start-floci.sh
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:6.0.13
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data/db
    restart: always
    healthcheck:
      test:
        ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb-init:
    image: mongo:6.0.13
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      mongosh "mongodb://mongodb:27017" --eval 'try { rs.status(); print("Replica set already initialized"); } catch (e) { if (e.message.includes("no replset config")) { rs.initiate({_id: "rs0", members: [{ _id: 0, host: "mongodb:27017" }]}); print("Replica set initialized"); } else { throw e; } }'
    networks:
      - cdp-tenant
    restart: 'no'

  farming-grants-agreements-api:
    extends:
      file: ./compose/farming-grants-agreements-api.yml
      service: farming-grants-agreements-api
    env_file:
      - 'compose/aws.env'
    profiles:
      - full
    depends_on:
      floci:
        condition: service_healthy
      floci-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
      mongodb-init:
        condition: service_completed_successfully

  mock-server:
    image: pactfoundation/pact-stub-server:0.7.0
    profiles:
      - mock
      - full
    restart: unless-stopped
    ports:
      - '8081:8081'
    volumes:
      - ./src/contracts/consumer/pacts:/app/pacts
    command: ['-p', '8081', '-d', 'pacts']
    networks:
      - cdp-tenant

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    name: cdp-tenant
